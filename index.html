<!DOCTYPE html>
<html lang="ja">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マネクエ</title>
  <style>
    :root {
      --bg-color: #121214; --card-bg: #1e1e24; --accent-color: #ffd700;
      --text-color: #f0f0f5; --sub-text: #a0a0b0; --border-color: #2e2e38;
      --danger-color: #ff5555; --success-color: #50fa7b; --income-color: #8be9fd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; padding: 16px; padding-bottom: 80px; }
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    header { text-align: center; padding: 12px; background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); }
    h1 { font-size: 1.5rem; color: var(--accent-color); }
    .card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border-color); }
    
    .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .level-badge { background: linear-gradient(135deg, #e65c00, #F9D423); color: #000; font-weight: bold; padding: 4px 12px; border-radius: 20px; }
    .gold-display { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); margin-bottom: 8px; text-align: right; }
    .exp-bar-container { width: 100%; height: 12px; background-color: #101014; border-radius: 6px; overflow: hidden; }
    .exp-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00b4db, #0083b0); transition: width 0.4s; }

    .type-selector { display: flex; gap: 8px; margin-bottom: 16px; }
    .type-btn { flex: 1; padding: 12px 8px; border: 1px solid var(--border-color); background: #101014; color: var(--sub-text); border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    .type-btn.active-expense { background: var(--danger-color); color: #000; border-color: var(--danger-color); }
    .type-btn.active-income { background: var(--income-color); color: #000; border-color: var(--income-color); }
    
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    input, select { background: #101014; border: 1px solid var(--border-color); color: var(--text-color); padding: 12px; border-radius: 6px; font-size: 1rem; width: 100%; }
    
    .btn { background: var(--accent-color); color: #000; border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem; }
    
    .history-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #101014; border-radius: 6px; }
    .history-item.expense { border-left: 4px solid var(--danger-color); }
    .history-item.income { border-left: 4px solid var(--income-color); }
    .empty-msg { text-align: center; color: var(--sub-text); padding: 12px; }
    .btn-delete { background: transparent; border: 1px solid var(--danger-color); color: var(--danger-color); padding: 6px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; margin-left: 8px; }

    .view-section { display: none; animation: fadeIn 0.3s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
